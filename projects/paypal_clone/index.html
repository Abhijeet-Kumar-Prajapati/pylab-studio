<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Interface</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="payment-card">
            <div class="logo">
                <div class="jarvis-circle">
                    <div class="inner-circle"></div>
                </div>
            </div>
            <h2>JARVIS INTERFACE</h2>
            <form id="paymentForm">
                <div class="form-group">
                    <input type="text" id="email" placeholder="Enter Access ID" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Security Code" required>
                </div>
                <button type="submit" class="login-btn">INITIALIZE SYSTEM</button>
                <div class="divider">
                    <span>SECURITY PROTOCOLS</span>
                </div>
                <button type="button" class="signup-btn">REQUEST ACCESS</button>
            </form>
            <div class="footer-links">
                <a href="#">Reset Credentials</a>
                <a href="#">Security</a>
                <a href="#">Protocols</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
