<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Money - PayPal Clone</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <nav>
                <h1>Send Money</h1>
                <div class="nav-links">
                    <a href="{{ url_for('dashboard') }}" class="btn">Back to Dashboard</a>
                </div>
            </nav>
        </header>
        <main>
            <div class="form-container">
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                <div class="balance-info">
                    <p>Available Balance: ${{ "%.2f"|format(current_user.balance) }}</p>
                </div>
                <form method="POST" action="{{ url_for('send_money') }}">
                    <div class="form-group">
                        <label for="receiver_email">Recipient Email:</label>
                        <input type="email" id="receiver_email" name="receiver_email" required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount ($):</label>
                        <input type="number" id="amount" name="amount" step="0.01" min="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description:</label>
                        <input type="text" id="description" name="description" required>
                    </div>
                    <button type="submit" class="btn">Send Money</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
